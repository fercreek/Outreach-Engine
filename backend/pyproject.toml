[project]
name = "studiolink-outreach-engine"
version = "0.1.0"
description = "TikTok cold outreach automation for StudioLink"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.48.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "httpx>=0.27.0",
]
